name: Public scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Generic rules only: the private deny list never enters this public repository or its CI.
      - run: node scripts/public-scan.mjs
      - run: node --test scripts/public-scan-test.mjs
